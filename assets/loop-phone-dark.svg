<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="The loop the factory ran: heartbeat, read the constitution, build, verify, improve the factory. A failed improvement reverted itself.">
<style>.b,.w{fill:none;stroke:rgba(243,240,232,.2);stroke-width:2}.t{font:600 28px "Helvetica Neue",Helvetica,Arial,sans-serif;fill:#f3f0e8}
.on{fill:none;stroke:#f4581f;stroke-width:4;opacity:0;animation:p 9s linear infinite}@keyframes p{0%{opacity:0}2%{opacity:1}15%{opacity:1}19%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect fill="#141412" width="640" height="640" rx="18"/><rect class="b" x="90" y="30" width="460" height="82" rx="14"/><rect class="on" x="90" y="30" width="460" height="82" rx="14" style="animation-delay:0.0s"/><text class="t" x="320" y="81" text-anchor="middle">heartbeat</text><path class="w" d="M320 112V142"/><rect class="b" x="90" y="142" width="460" height="82" rx="14"/><rect class="on" x="90" y="142" width="460" height="82" rx="14" style="animation-delay:0.8s"/><text class="t" x="320" y="193" text-anchor="middle">read the constitution</text><path class="w" d="M320 224V254"/><rect class="b" x="90" y="254" width="460" height="82" rx="14"/><rect class="on" x="90" y="254" width="460" height="82" rx="14" style="animation-delay:1.6s"/><text class="t" x="320" y="305" text-anchor="middle">build</text><path class="w" d="M320 336V366"/><rect class="b" x="90" y="366" width="460" height="82" rx="14"/><rect class="on" x="90" y="366" width="460" height="82" rx="14" style="animation-delay:2.4000000000000004s"/><text class="t" x="320" y="417" text-anchor="middle">verify</text><path class="w" d="M320 448V478"/><rect class="b" x="90" y="478" width="460" height="82" rx="14"/><rect class="on" x="90" y="478" width="460" height="82" rx="14" style="animation-delay:3.2s"/><text class="t" x="320" y="529" text-anchor="middle">improve the factory</text>
<path class="w" stroke-dasharray="6 7" d="M90 519H40V71H90"/>
<circle r="9" fill="#f4581f"><animateMotion dur="9s" repeatCount="indefinite" path="M90 30H550V560H90V612H40V30Z"/></circle>
</svg>