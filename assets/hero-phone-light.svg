<style>
.h{font:800 74px "Helvetica Neue",Helvetica,Arial,sans-serif;fill:#141412;letter-spacing:-2.5px}.s{font:400 25px "Helvetica Neue",Helvetica,Arial,sans-serif;fill:#66635c}
