<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 230" width="1100" height="230" role="img" aria-label="The loop the factory ran: heartbeat, read the constitution, build, verify, improve the factory. A failed improvement reverted itself.">
<style>.b,.w{fill:none;stroke:rgba(243,240,232,.2);stroke-width:1.5}.t{font:600 17px "Helvetica Neue",Helvetica,Arial,sans-serif;fill:#f3f0e8}.n{font:400 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#a7a297}
.on{fill:none;stroke:#f4581f;stroke-width:3;opacity:0;animation:p 9s linear infinite}@keyframes p{0%{opacity:0}2%{opacity:1}15%{opacity:1}19%,100%{opacity:0}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect fill="#141412" width="1100" height="230" rx="18"/><path class="w" d="M200 96H240"/><path class="w" d="M420 96H460"/><path class="w" d="M640 96H680"/><path class="w" d="M860 96H900"/><rect class="b" x="20" y="60" width="180" height="72" rx="12"/><rect class="on" x="20" y="60" width="180" height="72" rx="12" style="animation-delay:0.0s"/><text class="t" x="110" y="102" text-anchor="middle">heartbeat</text><rect class="b" x="240" y="60" width="180" height="72" rx="12"/><rect class="on" x="240" y="60" width="180" height="72" rx="12" style="animation-delay:0.8s"/><text class="t" x="330" y="92" text-anchor="middle">read the</text><text class="t" x="330" y="112" text-anchor="middle">constitution</text><rect class="b" x="460" y="60" width="180" height="72" rx="12"/><rect class="on" x="460" y="60" width="180" height="72" rx="12" style="animation-delay:1.6s"/><text class="t" x="550" y="102" text-anchor="middle">build</text><rect class="b" x="680" y="60" width="180" height="72" rx="12"/><rect class="on" x="680" y="60" width="180" height="72" rx="12" style="animation-delay:2.4000000000000004s"/><text class="t" x="770" y="102" text-anchor="middle">verify</text><rect class="b" x="900" y="60" width="180" height="72" rx="12"/><rect class="on" x="900" y="60" width="180" height="72" rx="12" style="animation-delay:3.2s"/><text class="t" x="990" y="92" text-anchor="middle">improve</text><text class="t" x="990" y="112" text-anchor="middle">the factory</text>
<path class="w" stroke-dasharray="5 6" d="M1080 96V184H20V96"/>
<text class="n" x="550" y="212" text-anchor="middle">a failed improvement reverted itself, then the heartbeat fired again</text>
<circle r="7" fill="#f4581f"><animateMotion dur="9s" repeatCount="indefinite" path="M20 60H1080V184H20Z"/></circle>
</svg>